name: Select the pinned Xcode
description: >-
  Selects the one Xcode version this repo builds with (PINNED_XCODE below), fails if
  the runner does not have it, and exports that Xcode's macOS SDK version as
  EXPECTED_SDK for later steps. Shared by ci.yml and release.yml, so CI and the
  release build with the same toolchain.
runs:
  using: composite
  steps:
    - name: Select the pinned Xcode
      shell: bash
      env:
        # RELEASE-INTEGRITY: the ONE place the Xcode version is pinned. Bumping it is a
        # deliberate one-line change in its own commit. When the runner image drops this
        # Xcode, every CI and release run fails and lists the Xcodes the image has.
        PINNED_XCODE: '26.6'
      run: |
        set -euo pipefail
        # The lookup is its own script so the missing-pin path can be tested on a Mac
        # (.github/scripts/release-integrity-test.sh) without touching xcode-select.
        xc="$("$GITHUB_WORKSPACE/.github/scripts/find-xcode.sh" "$PINNED_XCODE")"
        echo "selecting: $xc"
        sudo xcode-select -s "$xc/Contents/Developer"
        xcodebuild -version
        sdk="$(xcrun --sdk macosx --show-sdk-version)"
        sdk_major="${sdk%%.*}"
        case "$sdk_major" in ''|*[!0-9]*) echo "::error::cannot parse the selected SDK version '$sdk'"; exit 1 ;; esac
        [ "$sdk_major" -ge 26 ] || { echo "::error::selected Xcode's macOS SDK is $sdk, expected >= 26"; exit 1; }
        echo "::notice::building with $xc (Xcode $PINNED_XCODE), macOS SDK $sdk"
        echo "EXPECTED_SDK=$sdk" >> "$GITHUB_ENV"

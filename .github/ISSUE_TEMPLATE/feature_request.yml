name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to see, and why
      description: Describe the feature and the problem it would solve for you.
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior (optional)
      description: If you have a specific idea of how it should work, describe it here.
    validations:
      required: false

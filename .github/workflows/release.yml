name: Release

# Builds the Apple Silicon (arm64) MacDashboard.app, packages it with `ditto` (which
# preserves the ad-hoc signature across the zip round-trip), and attaches the
# .zip to a GitHub Release. The app is ad-hoc signed (not notarized), so on
# first launch users must clear Gatekeeper — see the README install section.
#
#   - push a tag `vX.Y`   -> builds that tag, creates the release if missing,
#                            uploads the asset
#   - "Run workflow" button -> select the TAG in the ref dropdown and type the
#                            same tag below. There is deliberately no default:
#                            a pre-filled tag plus `--clobber` is one click away
#                            from overwriting an older release's asset, and the
#                            v1.0 asset is this project's rollback anchor.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach the build to (must equal the ref selected above)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # The app's appearance follows the SDK recorded in its binary (LC_BUILD_VERSION
    # `sdk`), not the OS it runs on. The next step picks the newest release Xcode
    # >= 26 on whatever image macos-latest currently is (never assumed in advance),
    # and the SDK check below fails the run unless the binary records exactly
    # that Xcode's SDK.
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Manual run: the asset is uploaded with --clobber, so the tag must name
          # the very ref being built. Uploading a build of one ref onto another
          # ref's release silently replaces that release's asset.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::run this workflow from a tag — the ref dropdown currently points at '${REF_NAME}' (a ${{ github.ref_type }})"
            exit 1
          fi
          if [ "$INPUT_TAG" != "$REF_NAME" ]; then
            echo "::error::release_tag '$INPUT_TAG' does not match the ref being built ('$REF_NAME') — refusing to attach this build to a different release"
            exit 1
          fi
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Select the newest Xcode (>= 26)
        run: |
          set -euo pipefail
          # Discovered at run time: the runner image's Xcode set is never assumed.
          # Pre-release Xcodes (beta / RC in the bundle name) are skipped — a release
          # asset must not be built on a pre-release toolchain.
          echo "Xcodes on this runner:"
          candidates=""
          for xc in /Applications/Xcode*.app; do
            [ -d "$xc" ] || continue
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$xc/Contents/Info.plist" 2>/dev/null || echo '?')"
            echo "  $xc ($ver)"
            case "$xc" in *[Bb]eta*|*_RC*|*[Rr]elease_[Cc]andidate*) continue ;; esac
            major="${ver%%.*}"
            case "$major" in ''|*[!0-9]*) continue ;; esac
            [ "$major" -ge 26 ] || continue
            candidates="${candidates}${ver} ${xc}"$'\n'
          done
          best="$(printf '%s' "$candidates" | sort -V | tail -1)"
          [ -n "$best" ] || { echo "::error::no release Xcode >= 26 on this runner"; exit 1; }
          xc="${best#* }"
          echo "selecting: $xc (${best%% *})"
          sudo xcode-select -s "$xc/Contents/Developer"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          sdk_major="${sdk%%.*}"
          case "$sdk_major" in ''|*[!0-9]*) echo "::error::cannot parse the selected SDK version '$sdk'"; exit 1 ;; esac
          [ "$sdk_major" -ge 26 ] || { echo "::error::selected Xcode's macOS SDK is $sdk, expected >= 26"; exit 1; }
          echo "::notice::building with $xc, macOS SDK $sdk"
          echo "EXPECTED_SDK=$sdk" >> "$GITHUB_ENV"

      - name: Build .app
        run: ./build_app.sh

      - name: Assert arm64-only binary
        run: |
          set -euo pipefail
          archs="$(lipo -archs dist/MacDashboard.app/Contents/MacOS/MacDashboard)"
          echo "archs: $archs"
          if [ "$archs" != "arm64" ]; then
            echo "::error::binary archs are '$archs', expected exactly 'arm64' (the app is Apple Silicon only)"
            exit 1
          fi
          echo "arm64 OK"

      - name: Assert the binary records the selected Xcode's SDK
        run: |
          set -euo pipefail
          bin="dist/MacDashboard.app/Contents/MacOS/MacDashboard"
          norm() { sed -E 's/(\.0)+$//' <<<"$1"; }
          info="$(vtool -show-build "$bin")"
          rec="$(awk '$1=="sdk"{print $2; exit}' <<<"$info")"
          echo "selected Xcode's macOS SDK: $EXPECTED_SDK; binary records sdk ${rec:-none}"
          if [ "$(norm "$rec")" != "$(norm "$EXPECTED_SDK")" ]; then
            echo "::error::binary records SDK ${rec:-none}, but the selected Xcode's SDK is $EXPECTED_SDK"
            exit 1
          fi
          echo "OK — binary records SDK $EXPECTED_SDK"

      - name: Assert the private IOKit symbols are not hard-linked
        run: |
          set -euo pipefail
          # ThermalHIDReader resolves these six at runtime via dlopen/dlsym on
          # purpose: hard-linking them means the app fails to LAUNCH on a macOS
          # that dropped them. `nm` prints the Mach-O leading underscore.
          bin="dist/MacDashboard.app/Contents/MacOS/MacDashboard"
          syms="${RUNNER_TEMP:-.}/iokit-syms.txt"
          # Own command, not a pipeline: `nm` failing (renamed binary, toolchain
          # change) must fail the job. The old form buried it in a command
          # substitution ending in `|| true`, so the gate passed vacuously.
          nm -u "$bin" > "$syms"
          if [ ! -s "$syms" ]; then
            echo "::error::nm -u produced no undefined symbols for $bin — the gate cannot prove anything (wrong path or broken toolchain?)"
            exit 1
          fi
          bad="$(grep -E '_IOHID(EventSystemClient(Create|SetMatching|CopyServices)|ServiceClientCopy(Property|Event)|EventGetFloatValue)' "$syms" || true)"
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::private IOKit symbols are hard-linked again — they must stay behind dlopen/dlsym in ThermalHIDReader.swift"
            exit 1
          fi
          echo "no hard-linked private IOKit symbols"

      - name: Package (ditto preserves the ad-hoc signature)
        run: ditto -c -k --keepParent dist/MacDashboard.app MacDashboard.zip

      - name: Verify signature survives the zip round-trip
        run: |
          set -euo pipefail
          rm -rf _verify && mkdir _verify
          ditto -x -k MacDashboard.zip _verify
          # Signature must stay intact after packaging — this gates the release.
          codesign --verify --deep --strict --verbose=2 "_verify/MacDashboard.app"
          # Gatekeeper assessment is EXPECTED to be rejected (ad-hoc, not
          # notarized). We log it to document the exact message users will see;
          # never gate the release on it.
          spctl -a -vvv --type execute "_verify/MacDashboard.app" || true

      - name: Assert hardened runtime + AppleEvents entitlement
        run: |
          set -euo pipefail
          # `codesign --verify` passes just as happily on a binary with NO hardened runtime
          # and NO entitlements blob, so it cannot catch build_app.sh losing `--options
          # runtime` or `--entitlements`. Without them the shipped app fails empty-Trash
          # with -1743 for every user, and the DYLD_INSERT_LIBRARIES hole reopens.
          flags="$(codesign -dvv "_verify/MacDashboard.app" 2>&1 | sed -n 's/^CodeDirectory .*flags=\([^ ]*\).*/\1/p')"
          echo "CodeDirectory flags: $flags"
          case "$flags" in
            *runtime*) echo "hardened runtime OK" ;;
            *) echo "::error::hardened runtime flag missing (flags=${flags:-none}) — build_app.sh must sign with --options runtime"; exit 1 ;;
          esac
          codesign -d --entitlements :- --xml "_verify/MacDashboard.app" > _entitlements.plist 2>/dev/null
          plutil -p _entitlements.plist
          val="$(plutil -extract 'com\.apple\.security\.automation\.apple-events' raw -o - _entitlements.plist 2>/dev/null || echo missing)"
          if [ "$val" != "true" ]; then
            echo "::error::com.apple.security.automation.apple-events entitlement is $val — build_app.sh must sign with --entitlements MacDashboard.entitlements"
            exit 1
          fi
          echo "AppleEvents entitlement OK"

      - name: Attach to release
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "MacDashboard $TAG" \
              --notes "Apple Silicon (arm64) build. Intel Macs: download v2.1 from https://github.com/rdskcm/MacDashboard/releases/tag/v2.1. Ad-hoc signed, not notarized — see the README for the one-time first-launch Gatekeeper step."
          fi
          gh release upload "$TAG" MacDashboard.zip --clobber
          sum="$(shasum -a 256 MacDashboard.zip | awk '{print $1}')"
          echo "SHA-256: $sum"
          echo "SHA-256 of \`MacDashboard.zip\`: \`$sum\`" >> "$GITHUB_STEP_SUMMARY"

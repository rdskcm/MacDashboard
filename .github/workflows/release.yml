name: Release

# Builds the Apple Silicon (arm64) Moonport.app from a release tag, packages it with
# `ditto` (which preserves the ad-hoc signature across the zip round-trip), and creates
# a DRAFT GitHub Release holding Moonport.zip and SHA256SUMS. This workflow never
# publishes and never replaces an asset. Publishing is a separate manual step, done
# after the draft's assets are downloaded and checked (release protocol). The app is
# ad-hoc signed (not notarized), so on first launch users must clear Gatekeeper — see
# the README install section.
#
# RELEASE-INTEGRITY, in order:
#   - job `gate` (read-only token): the typed tag names the ref being built, the tagged
#     commit is on main or on a release/* branch, and a push-event CI run on that exact
#     commit has a successful `build-and-check` job. The checks live in
#     .github/scripts/release-gate.sh and run on a Mac with `gh` too. Nothing waits:
#     CI that is missing, still running or failed fails this run.
#   - job `release` (the only job with contents: write): no release or draft exists for
#     the tag, the pinned Xcode (.github/actions/select-xcode) builds the gated commit,
#     the bundle, binary and signature asserts pass, and one
#     `gh release create --draft --verify-tag` uploads both assets.
#
#   - push a tag `vX.Y[.Z]` -> runs both jobs for that tag
#   - "Run workflow" button -> select the TAG in the ref dropdown and type the same tag
#                              below. There is deliberately no default, so one click
#                              cannot aim a build at another release. Use it to retry
#                              once CI on the commit has succeeded, or after a bad
#                              draft was deleted by hand.
# A release or draft that already exists for the tag fails the run. Delete a bad draft
# by hand. A broken published build is fixed by the next patch number: v* tags are
# immutable (ruleset protect-release-tags).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (must equal the tag selected above)'
        required: true

permissions:
  contents: read

# One run per tag at a time, never cancelled: a second run for the same tag waits, then
# fails at the existing-release check instead of racing the first to create a draft.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # list CI runs and their jobs
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Manual run: the draft is created for the typed tag, so the tag must name the
          # very ref being built. Otherwise a build of one ref would become another tag's
          # release.
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from a tag — the ref dropdown currently points at '${REF_NAME}' (a ${REF_TYPE})"
            exit 1
          fi
          if [ "$INPUT_TAG" != "$REF_NAME" ]; then
            echo "::error::release_tag '$INPUT_TAG' does not match the ref being built ('$REF_NAME') — refusing to build a release for a different tag"
            exit 1
          fi
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve the tagged commit
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          sha="$(.github/scripts/release-gate.sh resolve "$REPO" "$TAG")"
          echo "$TAG -> $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: The commit is on main or a release/* branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: .github/scripts/release-gate.sh on-release-line "$REPO" "$SHA"

      - name: Push CI passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: .github/scripts/release-gate.sh ci-passed "$REPO" "$SHA"

  release:
    needs: gate
    # The app's appearance follows the SDK recorded in its binary (LC_BUILD_VERSION
    # `sdk`), not the OS it runs on. The floor is 26: the Tahoe (Liquid Glass)
    # appearance is gated on the SDK major version. The shared select-xcode action
    # (also used by ci.yml) selects the one pinned Xcode and fails if the runner image
    # lacks it, and the SDK check below fails the run unless the binary records exactly
    # that Xcode's SDK. A newer major SDK is not required: builds with SDK 26.5 and
    # SDK 27.0 showed no visible difference on macOS 27.0.1 (A/B, 2026-10-11).
    runs-on: macos-latest
    permissions:
      contents: write  # the only job allowed to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Refuse if a release or draft already exists for the tag
        # This job's token has push access, so drafts are listed too.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: .github/scripts/release-gate.sh no-release "$REPO" "$TAG"

      - name: Select the pinned Xcode
        uses: ./.github/actions/select-xcode

      - name: Build .app
        run: ./build_app.sh

      - name: Assert the bundle version matches the release tag
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist.noindex/Moonport.app/Contents/Info.plist)"
          echo "release tag: $TAG; CFBundleVersion: $ver"
          if [ "v$ver" != "$TAG" ]; then
            echo "::error::the app is version $ver but the release tag is $TAG — set VERSION in build_app.sh to match before tagging"
            exit 1
          fi
          echo "version OK"

      - name: Assert arm64-only binary
        run: |
          set -euo pipefail
          archs="$(lipo -archs dist.noindex/Moonport.app/Contents/MacOS/Moonport)"
          echo "archs: $archs"
          if [ "$archs" != "arm64" ]; then
            echo "::error::binary archs are '$archs', expected exactly 'arm64' (the app is Apple Silicon only)"
            exit 1
          fi
          echo "arm64 OK"

      - name: Assert the binary records the selected Xcode's SDK
        run: |
          set -euo pipefail
          bin="dist.noindex/Moonport.app/Contents/MacOS/Moonport"
          norm() { sed -E 's/(\.0)+$//' <<<"$1"; }
          info="$(vtool -show-build "$bin")"
          rec="$(awk '$1=="sdk"{print $2; exit}' <<<"$info")"
          echo "selected Xcode's macOS SDK: $EXPECTED_SDK; binary records sdk ${rec:-none}"
          if [ "$(norm "$rec")" != "$(norm "$EXPECTED_SDK")" ]; then
            echo "::error::binary records SDK ${rec:-none}, but the selected Xcode's SDK is $EXPECTED_SDK"
            exit 1
          fi
          echo "OK — binary records SDK $EXPECTED_SDK"

      - name: Assert the private IOKit symbols are not hard-linked
        run: |
          set -euo pipefail
          # ThermalHIDReader resolves these six at runtime via dlopen/dlsym on
          # purpose: hard-linking them means the app fails to LAUNCH on a macOS
          # that dropped them. `nm` prints the Mach-O leading underscore.
          bin="dist.noindex/Moonport.app/Contents/MacOS/Moonport"
          syms="${RUNNER_TEMP:-.}/iokit-syms.txt"
          # Own command, not a pipeline: `nm` failing (renamed binary, toolchain
          # change) must fail the job. The old form buried it in a command
          # substitution ending in `|| true`, so the gate passed vacuously.
          nm -u "$bin" > "$syms"
          if [ ! -s "$syms" ]; then
            echo "::error::nm -u produced no undefined symbols for $bin — the gate cannot prove anything (wrong path or broken toolchain?)"
            exit 1
          fi
          bad="$(grep -E '_IOHID(EventSystemClient(Create|SetMatching|CopyServices)|ServiceClientCopy(Property|Event)|EventGetFloatValue)' "$syms" || true)"
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::private IOKit symbols are hard-linked again — they must stay behind dlopen/dlsym in ThermalHIDReader.swift"
            exit 1
          fi
          echo "no hard-linked private IOKit symbols"

      - name: Package (ditto preserves the ad-hoc signature)
        run: ditto -c -k --keepParent dist.noindex/Moonport.app Moonport.zip

      - name: Verify signature survives the zip round-trip
        run: |
          set -euo pipefail
          rm -rf _verify && mkdir _verify
          ditto -x -k Moonport.zip _verify
          # Signature must stay intact after packaging — this gates the release.
          codesign --verify --deep --strict --verbose=2 "_verify/Moonport.app"
          # Gatekeeper assessment is EXPECTED to be rejected (ad-hoc, not
          # notarized). We log it to document the exact message users will see;
          # never gate the release on it.
          spctl -a -vvv --type execute "_verify/Moonport.app" || true

      - name: Assert hardened runtime + AppleEvents entitlement
        run: |
          set -euo pipefail
          # `codesign --verify` passes just as happily on a binary with NO hardened runtime
          # and NO entitlements blob, so it cannot catch build_app.sh losing `--options
          # runtime` or `--entitlements`. Without them the shipped app fails empty-Trash
          # with -1743 for every user, and the DYLD_INSERT_LIBRARIES hole reopens.
          flags="$(codesign -dvv "_verify/Moonport.app" 2>&1 | sed -n 's/^CodeDirectory .*flags=\([^ ]*\).*/\1/p')"
          echo "CodeDirectory flags: $flags"
          case "$flags" in
            *runtime*) echo "hardened runtime OK" ;;
            *) echo "::error::hardened runtime flag missing (flags=${flags:-none}) — build_app.sh must sign with --options runtime"; exit 1 ;;
          esac
          codesign -d --entitlements :- --xml "_verify/Moonport.app" > _entitlements.plist 2>/dev/null
          plutil -p _entitlements.plist
          val="$(plutil -extract 'com\.apple\.security\.automation\.apple-events' raw -o - _entitlements.plist 2>/dev/null || echo missing)"
          if [ "$val" != "true" ]; then
            echo "::error::com.apple.security.automation.apple-events entitlement is $val — build_app.sh must sign with --entitlements Moonport.entitlements"
            exit 1
          fi
          echo "AppleEvents entitlement OK"

      - name: Create the draft release (never published or replaced here)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # Checked again right before creating: a release could have been made by hand
          # while this run was building.
          .github/scripts/release-gate.sh no-release "$REPO" "$TAG"
          # --verify-tag only checks that the tag exists; make sure it still names the commit
          # the gate passed and this job built (v* tags are immutable by ruleset, this is the
          # check that does not rely on it).
          now="$(.github/scripts/release-gate.sh resolve "$REPO" "$TAG")"
          if [ "$now" != "$SHA" ]; then
            echo "::error::$TAG now points to $now, not the gated and built commit $SHA"
            exit 1
          fi
          # `shasum -a 256 -c SHA256SUMS` verifies the downloaded zip against this file.
          shasum -a 256 Moonport.zip > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          # Standard title "vX.Y (Codename)" (.github/RELEASE_NOTES_TEMPLATE.md), taken from the
          # bundle's CFBundleShortVersionString ("2.2 (Krieg)"). build_app.sh builds that string from
          # the same VERSION it writes to CFBundleVersion, and CFBundleVersion was checked against the
          # tag above. The notes are a placeholder: publishing replaces them with
          # `gh release edit --draft=false --notes-file`.
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist.noindex/Moonport.app/Contents/Info.plist)"
          # --verify-tag: never let gh create a missing tag. Both assets go up in this one call.
          gh release create "$TAG" Moonport.zip SHA256SUMS \
            --draft \
            --verify-tag \
            --title "v$short" \
            --notes "Apple Silicon (arm64) build. Intel Macs: download v2.1 from https://github.com/getmoonport/moonport/releases/tag/v2.1. Ad-hoc signed, not notarized — see the README for the one-time first-launch Gatekeeper step."
          sum="$(awk '{print $1}' SHA256SUMS)"
          echo "SHA-256: $sum"
          {
            echo "Draft release created for \`$TAG\` (not published)."
            echo "SHA-256 of \`Moonport.zip\`: \`$sum\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    # Must match release.yml: the app uses SwiftUI API from the macOS 26 SDK
    # (e.g. .onGeometryChange), which a macos-14 runner cannot compile.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use the macOS 26 (Tahoe) SDK
        run: |
          set -euo pipefail
          xc="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$xc" ] || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$xc/Contents/Developer"
          swift --version
          sdk="$(xcrun --show-sdk-version)"
          echo "macOS SDK: $sdk"
          case "$sdk" in
            26.*) echo "SDK 26 OK — app will get the Tahoe appearance" ;;
            *) echo "::error::selected SDK is $sdk, expected 26.x"; exit 1 ;;
          esac

      - name: swift build (default, AI off)
        run: swift build

      - name: swift build (AI opt-in build)
        run: swift build -Xswiftc -DAI_ENABLED

      - name: Run checks (MacDashboardChecks)
        run: swift run MacDashboardChecks

      - name: Run swift-testing suite (MacDashboardTests, CI only)
        # CI-SWIFT-TESTING: the local gate is MacDashboardChecks above; this target needs
        # the Testing module that ships with the Xcode selected in the first step.
        # The count guard fails the step if swift-testing ran zero tests, so a toolchain
        # or manifest change that silently skips the suite cannot pass as green.
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/swift-test.log"
          swift test 2>&1 | tee "$log"
          n="$(grep -Eo 'Test run with [0-9]+ test' "$log" | grep -Eo '[0-9]+' | tail -1 || true)"
          echo "swift-testing tests run: ${n:-none}"
          [ "${n:-0}" -gt 0 ] || { echo "::error::swift test ran no swift-testing tests"; exit 1; }

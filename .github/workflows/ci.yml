name: CI

on:
  # CI-SPEED: one run per PR commit. Branch pushes are covered by the pull_request
  # event (which tests the merge result); push runs only on main, after a merge.
  push:
    branches: [main]
  pull_request:

# A new commit on a PR cancels that PR's run still in progress. Pushes to main are
# grouped by commit SHA, so a run on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-check:
    # Same runner and Xcode rule as release.yml, via the shared select-xcode action:
    # the newest release Xcode >= 26 on the current macos-latest image, so CI builds
    # with the toolchain the release would use.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode (>= 26)
        uses: ./.github/actions/select-xcode

      - name: swift build (all targets, including tests)
        # CI-SPEED: the only compile in this run. --build-tests builds MacDashboard,
        # MacDashboardChecks and MacDashboardTests; the two steps below reuse it via
        # --skip-build and never compile.
        run: swift build --build-tests

      - name: Run checks (MacDashboardChecks)
        run: swift run --skip-build MacDashboardChecks

      - name: Run swift-testing suite (MacDashboardTests)
        # CI-SWIFT-TESTING: the local gate is MacDashboardChecks above; this target needs
        # the Testing module that ships with the Xcode selected in the first step.
        # The count guard fails the step if swift-testing ran zero tests, so a toolchain
        # or manifest change that silently skips the suite cannot pass as green.
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/swift-test.log"
          swift test --skip-build 2>&1 | tee "$log"
          n="$(grep -Eo 'Test run with [0-9]+ test' "$log" | grep -Eo '[0-9]+' | tail -1 || true)"
          echo "swift-testing tests run: ${n:-none}"
          [ "${n:-0}" -gt 0 ] || { echo "::error::swift test ran no swift-testing tests"; exit 1; }

      - name: swift build (AI opt-in build; last, so the two --skip-build steps above run the default build)
        run: swift build -Xswiftc -DAI_ENABLED

name: CI

on:
  # CI-SPEED: one run per PR commit. Branch pushes are covered by the pull_request
  # event (which tests the merge result); push runs only after a merge, on main and on
  # the maintenance branches release/*. RELEASE-INTEGRITY: Release builds only a commit
  # whose push run here succeeded, so a maintenance tag needs the release/* push run.
  push:
    branches: [main, 'release/*']
  pull_request:

permissions:
  contents: read

# A new commit on a PR cancels that PR's run still in progress. Pushes are
# grouped by commit SHA, so a push run on main or release/* is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  backport-only:
    # RELEASE-FEATURE-GATING: guards PRs into a maintenance branch (release/X.Y); see the
    # script header. Required by the protect-release ruleset; skipped on every other PR.
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Only backports of main commits and release prep
        run: >-
          .github/scripts/backport-only.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          origin/main

  build-and-check:
    # Same runner and Xcode as release.yml, via the shared select-xcode action: the one
    # pinned Xcode (the pin lives in the action), so CI builds with the toolchain the
    # release uses.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert the runner runs macOS >= 26
        # MIN-MACOS-26: the package's floor is macOS 26 and `swift test` runs the test
        # bundle on this runner, so a runner on an older macOS cannot load it.
        run: |
          set -euo pipefail
          os="$(sw_vers -productVersion)"
          echo "runner macOS: $os"
          [ "${os%%.*}" -ge 26 ] || { echo "::error::runner runs macOS $os, below the package's macOS 26 floor; set runs-on to macos-26"; exit 1; }

      - name: Select the pinned Xcode
        uses: ./.github/actions/select-xcode

      - name: Build all targets, failing on any warning
        # CI-SPEED: the only compile in this run. BUILD-WARNINGS: tools/check-warnings.sh builds
        # Moonport and MoonportTests (debug) from an empty scratch directory with Swift
        # warnings as errors and linker warnings fatal, and fails on any other warning line. The
        # same command reproduces this step on a Mac: `tools/check-warnings.sh`.
        # The test step below reuses this build via --skip-build and never compiles.
        run: tools/check-warnings.sh "$RUNNER_TEMP/build"

      - name: Run swift-testing suite (MoonportTests)
        # The only test gate (CHECKS-SWIFT-TESTING). Needs the Testing module that ships with
        # the Xcode selected in the first step.
        # The count guard fails the step if swift-testing ran zero tests, so a toolchain
        # or manifest change that silently skips the suite cannot pass as green.
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/swift-test.log"
          swift test --skip-build --scratch-path "$RUNNER_TEMP/build" 2>&1 | tee "$log"
          n="$(grep -Eo 'Test run with [0-9]+ test' "$log" | grep -Eo '[0-9]+' | tail -1 || true)"
          echo "swift-testing tests run: ${n:-none}"
          [ "${n:-0}" -gt 0 ] || { echo "::error::swift test ran no swift-testing tests"; exit 1; }

  agent-config:
    # AGENT-CONFIG-SYNC: AGENTS.md is generated from CLAUDE.md by tools/agent-config/agent_config.py.
    # Runs the generator's tests and its read-only drift check: exit 1 = AGENTS.md is stale (run
    # the generator, commit the result), exit 2 = invalid source or a hand-written AGENTS.md.
    # Ubuntu: needs only python3 and does not wait for a macOS runner. Skipped on release/*,
    # whose branches are cut from tags older than the generator.
    if: ${{ !startsWith(github.base_ref, 'release/') && !startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generator tests
        run: python3 -I -B -m unittest discover -s tools/agent-config -p 'test_*.py' -v

      - name: AGENTS.md matches CLAUDE.md
        run: python3 -I tools/agent-config/agent_config.py --check --root .
